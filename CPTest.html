<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CP24 Launcher</title>
  <meta http-equiv="refresh" content="14400"> <!-- Refresh every 4 hours -->
  <style>
    body {
      background: black;
      color: white;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
  </style>
</head>
<body>
  <div>Launching CP24 stream...</div>
  <script>
    const streamURL = "https://embed.jasperplayer.com/?brand=CP24&destination=cp24_web&language=EN&contentId=68595";

    // Try to open in a new tab (for kiosks, allow popups)
    const newWin = window.open(streamURL, '_blank');
    
    // Fallback: replace this window if popups blocked
    if (!newWin || newWin.closed || typeof newWin.closed === 'undefined') {
      window.location.href = streamURL;
    }
  </script>
</body>
</html>
